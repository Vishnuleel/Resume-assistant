name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    # Builds the same image Render deploys, so a broken Dockerfile fails here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resume-assistant .
      - name: Smoke test
        run: |
          docker run -d --name app -e PUBLIC_MODE=1 -p 8787:8787 resume-assistant
          for i in $(seq 1 30); do curl -fs http://localhost:8787/api/health && break; sleep 1; done
          curl -fs http://localhost:8787/ | grep -q '<div id="root">'
          docker logs app
